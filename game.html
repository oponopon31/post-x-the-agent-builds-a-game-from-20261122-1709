<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ORB CHAIN — tap to detonate, chains multiply your score</title>
<style>
  html, body { margin: 0; padding: 0; background: #070312; height: 100%; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #070312; touch-action: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="540" height="960"></canvas></div>
<script>
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 540, H = 960;

const PALETTE = ['#ff2e63', '#ffd60a', '#00e5ff', '#7cff4f', '#ff9f1c', '#c77dff', '#ff5da2'];
const RUN_SECONDS = 60;
const BLAST_RADIUS = 132;
const MAX_ORBS = 26;

function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }

let best = 0;
try { best = parseInt(localStorage.getItem('orbChainBest') || '0', 10) || 0; } catch (e) {}

const G = {
  mode: 'start',      // start | playing | over
  score: 0,
  chain: 0,           // orbs detonated in the current tap's chain
  bestChain: 0,
  timeLeft: RUN_SECONDS,
  detonated: 0,
  taps: 0,
  orbs: [],
  rings: [],
  sparks: [],
  pops: [],
  shake: 0,
  spawnTimer: 0,
  elapsed: 0,
  auto: new URLSearchParams(location.search).get('auto') === '1',
  autoTimer: 0,
};
window.__orbChain = G;

function makeOrb(x, y) {
  const r = rand(21, 33);
  return {
    x: x !== undefined ? x : rand(r + 8, W - r - 8),
    y: y !== undefined ? y : rand(170, H - r - 90),
    r: r,
    color: pick(PALETTE),
    vx: rand(-46, 46),
    vy: rand(-38, 38),
    pulse: rand(0, Math.PI * 2),
    alive: true,
    boomAt: 0,
  };
}

function seedField() {
  G.orbs = [];
  for (let i = 0; i < MAX_ORBS; i++) G.orbs.push(makeOrb());
}

function addPop(x, y, text, color, size) {
  G.pops.push({ x: x, y: y, text: text, color: color, size: size || 34, life: 1 });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(60, 320);
    G.sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, color: color, life: rand(0.4, 0.9), max: 0.9, r: rand(2, 5) });
  }
}

function detonate(orb, depth) {
  if (!orb.alive) return;
  orb.alive = false;
  G.chain += 1;
  G.detonated += 1;
  if (G.chain > G.bestChain) G.bestChain = G.chain;
  const pts = 10 * G.chain;
  G.score += pts;
  G.rings.push({ x: orb.x, y: orb.y, r: orb.r, max: BLAST_RADIUS, color: orb.color, life: 1 });
  burst(orb.x, orb.y, orb.color, 16);
  addPop(orb.x, orb.y - orb.r - 6, '+' + pts, orb.color, G.chain >= 4 ? 46 : 32);
  G.shake = Math.min(9, G.shake + 2);
  // Any live orb the blast ring reaches joins the chain, slightly delayed.
  for (const other of G.orbs) {
    if (other.alive && other.boomAt === 0 && dist(orb, other) < BLAST_RADIUS + other.r) {
      other.boomAt = G.elapsed + 0.09 + depth * 0.02;
    }
  }
  if (G.chain >= 4) addPop(W / 2, 300, 'CHAIN x' + G.chain + '!', '#ffd60a', 64);
}

function tapAt(x, y) {
  if (G.mode !== 'playing') return;
  let hit = null, bestD = 1e9;
  for (const o of G.orbs) {
    if (!o.alive) continue;
    const d = Math.hypot(o.x - x, o.y - y);
    if (d < o.r + 14 && d < bestD) { bestD = d; hit = o; }
  }
  if (!hit) return;
  G.taps += 1;
  G.chain = 0;
  detonate(hit, 0);
}

function startGame() {
  G.mode = 'playing';
  G.score = 0;
  G.chain = 0;
  G.bestChain = 0;
  G.timeLeft = RUN_SECONDS;
  G.detonated = 0;
  G.taps = 0;
  G.rings = [];
  G.sparks = [];
  G.pops = [];
  G.elapsed = 0;
  G.spawnTimer = 0;
  seedField();
}

function endGame() {
  G.mode = 'over';
  if (G.score > best) {
    best = G.score;
    try { localStorage.setItem('orbChainBest', String(best)); } catch (e) {}
  }
}

function autoPick() {
  // Detonate the live orb with the most neighbours inside blast range.
  let target = null, targetN = -1;
  for (const o of G.orbs) {
    if (!o.alive) continue;
    let n = 0;
    for (const p of G.orbs) if (p.alive && p !== o && dist(o, p) < BLAST_RADIUS + p.r) n++;
    if (n > targetN) { targetN = n; target = o; }
  }
  if (target) tapAt(target.x, target.y);
}

function step(dt) {
  G.elapsed += dt;
  if (G.mode === 'playing') {
    G.timeLeft -= dt;
    if (G.timeLeft <= 0) { G.timeLeft = 0; endGame(); }
    // Delayed chain detonations.
    for (const o of G.orbs) {
      if (o.alive && o.boomAt !== 0 && G.elapsed >= o.boomAt) { o.boomAt = 0; detonate(o, 1); }
    }
    // Keep the field stocked: chains can wipe most of the field in one
    // tap, so restock in small bursts instead of one orb at a time.
    G.spawnTimer += dt;
    if (G.spawnTimer > 0.6) {
      G.spawnTimer = 0;
      const live = G.orbs.filter(o => o.alive).length;
      for (let i = 0; i < 3 && live + i < MAX_ORBS; i++) G.orbs.push(makeOrb());
    }
    if (G.auto) {
      G.autoTimer += dt;
      if (G.autoTimer > 0.65) { G.autoTimer = 0; autoPick(); }
    }
  }
  // Drift the orbs.
  for (const o of G.orbs) {
    if (!o.alive) continue;
    o.x += o.vx * dt;
    o.y += o.vy * dt;
    o.pulse += dt * 3;
    if (o.x < o.r + 4) { o.x = o.r + 4; o.vx = Math.abs(o.vx); }
    if (o.x > W - o.r - 4) { o.x = W - o.r - 4; o.vx = -Math.abs(o.vx); }
    if (o.y < 150 + o.r) { o.y = 150 + o.r; o.vy = Math.abs(o.vy); }
    if (o.y > H - o.r - 70) { o.y = H - o.r - 70; o.vy = -Math.abs(o.vy); }
  }
  // Blast rings expand and fade.
  for (const r of G.rings) { r.r += 620 * dt; r.life -= dt * 2.6; }
  G.rings = G.rings.filter(r => r.life > 0 && r.r < r.max);
  // Sparks fly and fade.
  for (const s of G.sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 260 * dt; s.life -= dt; }
  G.sparks = G.sparks.filter(s => s.life > 0);
  // Score pops float up and fade.
  for (const p of G.pops) { p.y -= 46 * dt; p.life -= dt * 0.9; }
  G.pops = G.pops.filter(p => p.life > 0);
  // Remove dead orbs once their ring is gone.
  G.orbs = G.orbs.filter(o => o.alive);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 26);
}

function drawOrb(o) {
  const wobble = 1 + Math.sin(o.pulse) * 0.06;
  const r = o.r * wobble;
  const g = ctx.createRadialGradient(o.x - r * 0.3, o.y - r * 0.35, r * 0.1, o.x, o.y, r);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.25, o.color);
  g.addColorStop(1, '#101018');
  ctx.beginPath();
  ctx.arc(o.x, o.y, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = o.color;
  ctx.globalAlpha = 0.85;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  // Background: deep space with faint stars.
  ctx.fillStyle = '#070312';
  ctx.fillRect(-12, -12, W + 24, H + 24);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 70; i++) {
    const sx = (i * 97) % W, sy = (i * 173) % H;
    ctx.fillRect(sx, sy, 2, 2);
  }

  if (G.mode === 'start') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd60a';
    ctx.font = '900 96px Arial, sans-serif';
    ctx.fillText('ORB', W / 2, 330);
    ctx.fillStyle = '#00e5ff';
    ctx.fillText('CHAIN', W / 2, 430);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 34px Arial, sans-serif';
    ctx.fillText('TAP AN ORB TO', W / 2, 540);
    ctx.fillText('DETONATE IT', W / 2, 588);
    ctx.fillStyle = '#ffd60a';
    ctx.font = 'bold 30px Arial, sans-serif';
    ctx.fillText('CHAINS MULTIPLY', W / 2, 680);
    ctx.fillText('YOUR SCORE', W / 2, 722);
    ctx.fillStyle = '#9aa0c0';
    ctx.font = '28px Arial, sans-serif';
    ctx.fillText('60 seconds on the clock', W / 2, 800);
    ctx.fillStyle = '#7cff4f';
    ctx.font = 'bold 36px Arial, sans-serif';
    ctx.fillText('▶  TAP TO START', W / 2, 890);
    // A few decorative orbs.
    for (let i = 0; i < 5; i++) {
      drawOrb({ x: 90 + i * 90, y: 130 + (i % 2) * 26, r: 26, color: PALETTE[i], pulse: i * 1.3 });
    }
  } else {
    for (const o of G.orbs) drawOrb(o);
    // Blast rings.
    for (const r of G.rings) {
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.lineWidth = 7;
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = Math.max(0, r.life);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // Sparks.
    for (const s of G.sparks) {
      ctx.globalAlpha = Math.max(0, s.life / s.max);
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Score pops.
    ctx.textAlign = 'center';
    for (const p of G.pops) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.font = '900 ' + p.size + 'px Arial, sans-serif';
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    // HUD.
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 84px Arial, sans-serif';
    ctx.fillText(String(G.score), 24, 108);
    ctx.font = 'bold 30px Arial, sans-serif';
    ctx.fillStyle = '#9aa0c0';
    ctx.fillText('BEST ' + best, 26, 148);
    ctx.textAlign = 'right';
    const t = Math.ceil(G.timeLeft);
    ctx.fillStyle = t <= 10 ? '#ff2e63' : '#ffd60a';
    ctx.font = '900 84px Arial, sans-serif';
    ctx.fillText(t + 's', W - 24, 108);
    ctx.font = 'bold 28px Arial, sans-serif';
    ctx.fillStyle = '#9aa0c0';
    ctx.fillText('CHAIN x' + G.bestChain, W - 24, 148);

    if (G.mode === 'over') {
      ctx.fillStyle = 'rgba(5,3,18,0.82)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd60a';
      ctx.font = '900 72px Arial, sans-serif';
      ctx.fillText("TIME'S UP!", W / 2, 400);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 40px Arial, sans-serif';
      ctx.fillText('SCORE  ' + G.score, W / 2, 500);
      ctx.fillStyle = '#00e5ff';
      ctx.fillText('BEST CHAIN  x' + G.bestChain, W / 2, 560);
      ctx.fillText('ORBS BLOWN  ' + G.detonated, W / 2, 620);
      ctx.fillStyle = '#7cff4f';
      ctx.font = 'bold 38px Arial, sans-serif';
      ctx.fillText('PRESS R TO PLAY AGAIN', W / 2, 740);
    }
  }
  ctx.restore();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

function pointerPos(e) {
  const rect = cv.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
}

cv.addEventListener('pointerdown', (e) => {
  const p = pointerPos(e);
  if (G.mode === 'start') startGame();
  else if (G.mode === 'over') startGame();
  else tapAt(p.x, p.y);
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    if (G.mode !== 'playing') startGame();
    e.preventDefault();
  }
  if (e.code === 'KeyR' && G.mode === 'over') startGame();
});

seedField();
if (G.auto) setTimeout(startGame, 400);
requestAnimationFrame(loop);
</script>
</body>
</html>
